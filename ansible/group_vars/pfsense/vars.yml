---
# pfsensible.core modules connect to pfSense via SSH and modify
# /cf/conf/config.xml directly. Python3 must be installed on pfSense first
# (handled automatically by the bootstrap play in configure_pfsense.yml).
ansible_connection: ssh
ansible_user: admin
ansible_python_interpreter: /usr/local/bin/python3.11

# pfSense host — set to the EIP from terraform output pfsense_public_ip
pfsense_host: "YOUR_PFSENSE_PUBLIC_IP"

# pfSense admin credentials (used by pfsensible.core modules)
pfsense_user:     admin
pfsense_password: "pfsense"  # Change after first login

# Interfaces (pfSense logical names)
wan_interface: wan
lan_interface: lan

# LAN subnet (used as IPsec local selector)
lan_cidr: "172.31.254.0/24"

# IPsec tunnel description (referenced in phase1 + phase2 tasks)
vpn_tunnel_description: "Twilio VPN"
